<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PUMP Live Pilot</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#0f1115;color:#f4f5f7;margin:0;padding:24px}.wrap{max-width:760px;margin:auto}.card{background:#171a21;border:1px solid #2c313c;border-radius:18px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.big{font-size:30px;font-weight:800}.muted{color:#aeb6c4}.safe{font-size:34px;font-weight:900}.status{font-weight:800}code{background:#222733;padding:3px 6px;border-radius:6px}</style></head><body><div class="wrap"><h1>Kraken PUMP Live Pilot</h1><div class="card"><div class="muted">Status</div><div id="status" class="big">Loading…</div><div id="error" class="muted"></div></div><div class="grid"><div class="card"><div class="muted">Your Capital</div><div id="capital" class="big">—</div></div><div class="card"><div class="muted">Capital Working</div><div id="working" class="big">—</div></div><div class="card"><div class="muted">Pending Profit</div><div id="pending" class="big">—</div></div><div class="card"><div class="muted">SAFE TO WITHDRAW</div><div id="safe" class="safe">—</div></div></div><div class="card"><div>Pair: <b id="pair">—</b> · Target: <b id="target">—</b></div><div>Price: <b id="price">—</b> · Target price: <b id="targetPrice">—</b></div><div>Harvests: <b id="harvests">—</b></div><div>API configured: <b id="api">—</b> · Live trading: <b id="live">—</b></div></div></div><script>const m=x=>'$'+Number(x||0).toFixed(2);async function refresh(){try{const r=await fetch('/api/state',{cache:'no-store'}),s=await r.json();status.textContent=s.status;error.textContent=s.lastError||'';capital.textContent=m(s.capitalUsd);working.textContent=m(s.positionValueUsd);pending.textContent=m(s.pendingProfitUsd);safe.textContent=m(s.safeToWithdrawUsd);pair.textContent=s.pair;target.textContent=Number(s.targetPct).toFixed(2)+'%';price.textContent=m(s.lastPrice);targetPrice.textContent=s.targetPrice?m(s.targetPrice):'—';harvests.textContent=s.harvestCount;api.textContent=s.credentialsConfigured?'YES':'NO';live.textContent=s.liveTrading?'ARMED':'OFF';}catch(e){status.textContent='OFFLINE';error.textContent=e.message}}refresh();setInterval(refresh,5000)</script></body></html>
