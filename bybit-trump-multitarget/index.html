<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRUMP Harvest Lab — Bybit</title><style>body{font-family:Arial,sans-serif;background:#0f1115;color:#fff;margin:0;padding:20px}main{max-width:980px;margin:auto}.card{background:#171a21;border:1px solid #2a2f3a;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.k{font-size:12px;color:#9aa3b2;text-transform:uppercase}.v{font-size:26px;font-weight:700;margin-top:5px}.good{color:#39d98a}.warn{color:#ffb020}.bad{color:#ff5d5d}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #2a2f3a;text-align:right}td:first-child,th:first-child{text-align:left}button{padding:10px 14px;border-radius:10px;border:0;font-weight:700}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#252a33;font-size:12px}h1{margin-bottom:4px}.sub{color:#9aa3b2;margin-top:0}</style></head><body><main><h1>TRUMP Harvest Lab — Bybit</h1><p class="sub">TRUMP/USDT Spot · Bybit V5 · multi-target dashboard</p><div class="card grid"><div><div class="k">Price</div><div class="v" id="price">—</div></div><div><div class="k">Spread</div><div class="v" id="spread">—</div></div><div><div class="k">Fee / side</div><div class="v" id="fee">—</div></div><div><div class="k">Break-even</div><div class="v" id="be">—</div></div><div><div class="k">Minimum order</div><div class="v" id="min">—</div></div><div><div class="k">Mode</div><div class="v" id="mode">—</div></div></div><div class="card"><h2>Targets</h2><table><thead><tr><th>Target</th><th>Gross / $1,000</th><th>Net % est.</th><th>Net / $1,000</th><th>Live</th></tr></thead><tbody id="targets"></tbody></table></div><div class="card grid"><div><div class="k">Status</div><div class="v" id="status">—</div></div><div><div class="k">Cycles</div><div class="v" id="cycles">—</div></div><div><div class="k">Realized profit</div><div class="v" id="profit">—</div></div><div><div class="k">Open positions</div><div class="v" id="open">—</div></div></div><div class="card"><div class="k">Last error</div><div id="err">None</div></div></main><script>async function load(){try{const r=await fetch('/api/state',{cache:'no-store'}),s=await r.json();price.textContent=s.lastPrice?Number(s.lastPrice).toFixed(4):'—';spread.textContent=s.spreadPct==null?'—':s.spreadPct.toFixed(4)+'%';fee.textContent=s.feePct.toFixed(3)+'%';be.textContent=s.breakEvenPct.toFixed(4)+'%';min.textContent='$'+Number(s.minOrderUsdt).toFixed(2);mode.textContent=s.liveTrading?'LIVE':'SAFE / OFF';mode.className='v '+(s.liveTrading?'good':'warn');status.textContent=s.status;cycles.textContent=s.cycles;profit.textContent='$'+Number(s.realizedProfitUsdt).toFixed(4);open.textContent=s.openPositions.filter(x=>x.open).length;err.textContent=s.lastError||'None';targets.innerHTML=s.grossTable.map(x=>`<tr><td>${x.targetPct}%</td><td>$${x.grossProfitPer1000.toFixed(2)}</td><td class="${x.estimatedNetPct>0?'good':'bad'}">${x.estimatedNetPct.toFixed(4)}%</td><td class="${x.estimatedNetPer1000>0?'good':'bad'}">$${x.estimatedNetPer1000.toFixed(2)}</td><td>${x.liveEligible?'✅':'monitor'}</td></tr>`).join('');}catch(e){err.textContent=e.message}}load();setInterval(load,5000)</script></body></html>
